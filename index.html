<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1a54">
  <title>NutriPlan · Camino a la Spartan Beast</title>
  <link rel="icon" href="img/nutriplan.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-bg"></div>
    <div class="top-inner">
      <img class="logo" src="img/nutriplan.jpg" alt="NutriPlan">
      <div class="top-text">
        <h1>NutriPlan</h1>
        <p>Spartan Beast · Tenerife</p>
      </div>
      <button id="btn-user" class="chip" type="button" hidden></button>
    </div>
    <div class="countdown" id="countdown"></div>
  </header>

  <main class="app">
    <section id="login" class="panel" hidden>
      <h2>Entra para empezar</h2>
      <p>Tus entrenamientos y comidas se guardan en tu cuenta de Firestore.</p>
      <button id="btn-login" class="btn primary" type="button">Entrar con Google</button>
    </section>

    <section id="planner" hidden>
      <nav class="datenav" aria-label="Navegación de días">
        <button id="prev" class="icon-btn" type="button" aria-label="Día anterior">‹</button>
        <label class="datepick">
          <span id="date-label">—</span>
          <input id="date-input" type="date" aria-label="Elegir día">
        </label>
        <button id="next" class="icon-btn" type="button" aria-label="Día siguiente">›</button>
      </nav>
      <div class="subnav">
        <button id="today" class="chip" type="button">Hoy</button>
        <button id="race" class="chip warm" type="button">🏁 Día de carrera</button>
      </div>

      <div id="week-strip" class="week-strip"></div>

      <div id="seed-banner" class="panel" hidden>
        <p>Aún no hay plan guardado. Cárgalo desde el PDF (6 semanas) a Firestore.</p>
        <button id="btn-seed" class="btn primary" type="button">Cargar plan</button>
      </div>

      <article id="day"></article>

      <details class="panel guide">
        <summary>Guía rápida de nutrición</summary>
        <div id="guide"></div>
      </details>

      <div class="footer-actions">
        <button id="btn-reseed" class="btn ghost small" type="button">Restablecer plan original</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
